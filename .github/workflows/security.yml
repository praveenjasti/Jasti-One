name: Security and dependency checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Verify complete hash-locked dependency file
        run: python -m pip install --dry-run --require-hashes -r requirements.lock

  python-security:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: mkdir -p security-reports
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: python -m compileall -q pdcm tests
      - run: python -m pip freeze > security-reports/dependency-snapshot.txt
        if: always()
      - run: python -m pip_audit --local --format json -o security-reports/pip-audit-installed.json
        if: always()
      - run: python -m pip_audit -r requirements.lock --format json -o security-reports/pip-audit-lock.json
        if: always()
      - run: python -m bandit -q -r pdcm -f json -o security-reports/bandit.json
        if: always()
      - run: python -m pytest -q -ra --junitxml=security-reports/test-results-ubuntu.xml
        if: always()
      - run: python -m cyclonedx_py environment --pyproject pyproject.toml --of JSON -o security-reports/sbom.cdx.json --output-reproducible
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-artifacts-ubuntu
          retention-days: 90
          if-no-files-found: warn
          path: |
            security-reports/*

  windows-filesystem-tests:
    runs-on: windows-2025
    env:
      JASTI_REQUIRE_SYMLINK_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Prepare security artifact directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force security-reports | Out-Null
      - name: Record Windows and Python test environment
        shell: pwsh
        run: |
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber | Out-File security-reports/windows-environment.txt
          whoami /user 2>&1 | Out-File security-reports/windows-environment.txt -Append
          whoami /priv 2>&1 | Out-File security-reports/windows-environment.txt -Append
          python --version 2>&1 | Out-File security-reports/windows-environment.txt -Append
          python -m pytest --version 2>&1 | Out-File security-reports/windows-environment.txt -Append
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: python -m compileall -q pdcm tests
      - run: python -m pytest -q -ra --junitxml=security-reports/test-results-windows.xml
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-artifacts-windows
          retention-days: 90
          if-no-files-found: warn
          path: security-reports/*
