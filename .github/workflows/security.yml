name: Security and dependency checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Verify complete hash-locked dependency file
        run: python -m pip install --dry-run --require-hashes -r requirements.lock

  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,gmail]"
      - run: python -m pip freeze > dependency-snapshot.txt
        if: always()
      - run: python -m pip_audit --local --format json --output pip-audit.json
        if: always()
      - run: python -m pip_audit -r requirements.in --format json --output pip-audit-requirements.json
        if: always()
      - run: python -m pip_audit -r requirements.lock --format json --output pip-audit-lock.json
        if: always()
      - run: python -m bandit -q -r pdcm --format json --output bandit.json
        if: always()
      - run: python -m pytest -q
        if: always()
      - run: cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-artifacts
          path: |
            dependency-snapshot.txt
            pip-audit.json
            pip-audit-requirements.json
            pip-audit-lock.json
            bandit.json
            sbom.cdx.json

  windows-filesystem-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
