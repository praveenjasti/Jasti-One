[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "jasti-one"
version = "1.2.0"
requires-python = ">=3.11"
dependencies = ["PySide6==6.12.0", "psutil==7.2.2"]

[project.optional-dependencies]
gmail = ["google-api-python-client==2.202.0", "google-auth-oauthlib==1.2.0"]
dev = ["pytest==9.0.3", "pip-audit==2.10.1", "bandit==1.9.4", "cyclonedx-bom==9.0.0"]

[project.scripts]
jasti-one = "pdcm.app:main"
pdcm = "pdcm.app:main"

[tool.setuptools.packages.find]
include = ["pdcm*"]
