[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jasti-one"
version = "1.2.0"
requires-python = ">=3.11"
dependencies = ["PySide6==6.7.0", "psutil==5.9.8"]

[project.optional-dependencies]
gmail = ["google-api-python-client==2.120.0", "google-auth-oauthlib==1.2.0"]
dev = ["pytest==9.0.3", "pip-audit==2.7.3", "bandit==1.7.8", "cyclonedx-bom==4.3.0"]

[project.scripts]
jasti-one = "pdcm.app:main"
pdcm = "pdcm.app:main"

[tool.setuptools.packages.find]
include = ["pdcm*"]
